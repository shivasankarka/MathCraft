<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="MathCraft">
  <title>MathCraft</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f95ff"/>
      <stop offset="1" stop-color="#3a60e0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#14286e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- the curve the bird sits on: one period of a sine wave -->
  <path d="M185 760 C 300 640, 420 640, 512 760 S 724 880, 839 760" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="22" stroke-linecap="round"/>
  <g filter="url(#soft)">
    <!-- tail -->
    <path d="M640 600 L 790 650 Q 815 660 800 682 Q 786 700 760 692 L 625 660 Z" fill="url(#body)"/>
    <!-- feet -->
    <path d="M470 700 v40 M545 704 v36" stroke="#2b3a74" stroke-width="12" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="512" cy="500" rx="250" ry="225" fill="url(#body)"/>
    <!-- wing -->
    <path d="M520 510 C 620 480, 700 520, 722 585 C 650 635, 560 625, 520 510 Z" fill="#d3dcf5"/>
    <!-- cheek -->
    <ellipse cx="402" cy="540" rx="34" ry="22" fill="#ffb7c0" opacity="0.7"/>
    <!-- eye -->
    <circle cx="418" cy="476" r="21" fill="#141a33"/>
    <circle cx="425" cy="469" r="7" fill="#ffffff"/>
    <!-- beak -->
    <path d="M338 508 Q 316 512 322 524 Q 336 534 356 520 Z" fill="#141a33"/>
  </g>
</svg>
