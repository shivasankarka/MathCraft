[package]
name = "mathcraft-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "MathCraft interpreter: values, evaluation of the Python-flavoured language, builtin functions (L1)"

[dependencies]
mathcraft-core.workspace = true
mathcraft-algebra.workspace = true
mathcraft-amplitude.workspace = true
mathcraft-syntax.workspace = true
dashu.workspace = true
faer = { workspace = true, optional = true }

[features]
# Fast dense float linear algebra (matrix product, det, inverse, solve) from faer. Off for builds that must stay small.
default = ["fast-linalg"]
fast-linalg = ["dep:faer"]

[lints]
workspace = true
