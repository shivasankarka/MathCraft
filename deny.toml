# cargo-deny config. Run `cargo xtask licenses` (licences only) or `cargo deny check` (everything).
# Policy (copied from ArtCraft, see reference/craft-anything/docs/licences.md): permissive licences only,
# never link or bundle copyleft code. Run: cargo deny check licenses

[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerable, unmaintained or yanked crates are reported.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. Dual-licensed crates (e.g. self_cell, r-efi) pass through their
# permissive option, so they need no exception.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016", # Unicode data licence (permissive, OSI-approved), the older form of Unicode-3.0. Needed by ruff_unicode_names2 (via ruff_python_parser). NOT on the ArtCraft house allowlist: ask the maintainers before merging (docs/PLAN.md, Q10).
    "BSL-1.0",
    "OFL-1.1",         # egui's embedded default fonts (epaint_default_fonts)
    "Ubuntu-font-1.0", # same crate
]
confidence-threshold = 0.9
# MPL-2.0 is file-level copyleft: allowed only for named crates, used unmodified.
# (`colored`, also MPL-2.0, appears in Cargo.lock only behind egui_kittest's optional `dify`;
# it is not built, so it gets no exception. Add one if it ever enters the graph.)
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies are exempt only in crates marked `publish = false`. Our workspace crates
# are not marked yet, so `cargo deny check bans` flags their internal path deps until they are.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
